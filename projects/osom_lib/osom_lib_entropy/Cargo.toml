[package]
name = "osom_lib_entropy"
version = "0.1.21"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "OS-backed entropy collection for osom_lib."
documentation = "https://docs.rs/osom_lib_entropy"

[dependencies]
osom_lib_macros = { path = "../osom_lib_macros", version = "0.1" }
osom_lib_reprc = { path = "../osom_lib_reprc", version = "0.1" }
osom_lib_try_clone = { path = "../osom_lib_try_clone", version = "0.1" }

[target.'cfg(any(target_os="macos", target_os="linux"))'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os="windows")'.dependencies]
windows-sys = { workspace = true }
