[package]
name = "osom_lib_hash_tables"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
osom_lib_cfg_ext = { path = "../osom_lib_cfg_ext", version = "0.1" }
osom_lib_macros = { path = "../osom_lib_macros", version = "0.1" }
osom_lib_primitives = { path = "../osom_lib_primitives", version = "0.1" }
osom_lib_reprc = { path = "../osom_lib_reprc", version = "0.1" }
osom_lib_alloc = { path = "../osom_lib_alloc", version = "0.1" }
osom_lib_hashes = { path = "../osom_lib_hashes", version = "0.1" }

[dev-dependencies]
paste = { workspace = true }
rstest = { workspace = true }
criterion = { workspace = true }

[features]
default = ["std"]
std = ["osom_lib_alloc/std"]

[[bench]]
name = "inserts"
harness = false

[[bench]]
name = "reads"
harness = false
